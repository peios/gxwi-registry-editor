# What Registry Editor is to a desktop (PGSS Applications): installed as
# /usr/share/apps/dev.peios.gxwi-registry-editor.toml, named for the id, by
# the package that installs the program. It is a window and nothing else:
# what a terminal does with the registry is reg's.
title = "Registry Editor"
description = "Browse the registry's keys and values"
program = "/usr/bin/gxwi-registry-editor"
