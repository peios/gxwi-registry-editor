[package]
name = "gxwi-registry-editor"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Beside this checkout until a libgxwi with the dialog role is released.
libgxwi = { path = "../gxwi/libgxwi" }
# The registry, and its values decoded by their types. The revision libgxwi
# pins, which it must: `peios-sys` links libpeios, and a program can hold
# only one of it.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "2a2a6bb022192f6e98d4e4a6a7efdbdd40d53b35", package = "peios" }
# The permissions editor, opened on a key or on a descriptor a value holds,
# and who a key under Users is, said as the editor says it. Beside this
# checkout until it is pushed.
gxwi-sd-editor = { path = "../gxwi-sd-editor", default-features = false, features = ["names", "splice", "registry", "propagate"] }
# What the registry manual says of a key and its values, read as regman
# reads it. Beside this checkout until it is pushed.
libregman = { path = "../peiosutils/src/uu/regman/libregman" }
# The registry document, written and read as reg writes and reads it.
# Beside this checkout until it is pushed.
libreg = { path = "../peiosutils/src/uu/reg/libreg" }
serde_json = "1"
# The file to export to, import from, back up to or restore from, chosen in
# the shared file dialog: its protocol, and nothing of its program. Beside
# this checkout until it is pushed.
gxwi-file-dialog = { path = "../gxwi-file-dialog", default-features = false }
# A key's last change, said on this machine's clock.
jiff = "0.2.29"
# For waiting on the keys being watched.
libc = "0.2"
